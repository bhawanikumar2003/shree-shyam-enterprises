            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>

        </aside>

        <!-- Product Grid Display -->

          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
            <div id="products-count-label" style="font-weight:700; color:var(--text-muted);">Showing Products</div>
            <input type="text" id="catalog-search-input" placeholder="Filter category..." style="padding:0.5rem 1rem; border:1px solid var(--border-color); border-radius:var(--radius-md); background:var(--bg-tertiary); color:var(--text-main);">

    <a href="https://wa.me/917352383419" class="mobile-nav-item" target="_blank" style="color:#25D366;">

  <script src="js/main.js?v=3.0"></script>
  <script src="js/cart.js?v=3.0"></script>
  <script src="js/products.js?v=3.0"></script>
  <script src="js/search.js?v=3.0"></script>
  <script src="js/voice-search.js?v=3.0"></script>
  <script src="js/app-installer.js?v=3.0"></script>

  <script>
    let catalogProducts = [];
    let currentCategory = 'all';

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      currentCategory = urlParams.get('category') || 'all';

      const { products, categories } = await loadProductData();
      catalogProducts = products;

      // Render category filter links
      const catList = document.getElementById('category-filters-list');
      if (catList) {
        catList.innerHTML = `
          <button onclick="filterByCategory('all')" class="btn btn-sm ${currentCategory === 'all' ? 'btn-primary' : 'btn-outline'}" style="justify-content:flex-start;">All Products</button>
          ${categories.map(c => `
            <button onclick="filterByCategory('${c.id}')" class="btn btn-sm ${currentCategory === c.id ? 'btn-primary' : 'btn-outline'}" style="justify-content:flex-start;"><i class="${c.icon}"></i> ${c.name}</button>
          `).join('')}
        `;
      }

      renderCatalogGrid();

      document.getElementById('sort-products-select')?.addEventListener('change', renderCatalogGrid);
      document.getElementById('catalog-search-input')?.addEventListener('input', renderCatalogGrid);
    });

    function filterByCategory(catId) {
      currentCategory = catId;
      document.querySelectorAll('#category-filters-list button').forEach(btn => {
        btn.classList.remove('btn-primary');
        btn.classList.add('btn-outline');
      });
      renderCatalogGrid();
    }

    function renderCatalogGrid() {
      const grid = document.getElementById('catalog-products-grid');
      const countLabel = document.getElementById('products-count-label');
      const searchVal = (document.getElementById('catalog-search-input')?.value || '').toLowerCase().trim();
      const sortVal = document.getElementById('sort-products-select')?.value || 'featured';

      let filtered = catalogProducts.filter(p => {
        if (currentCategory !== 'all' && p.category !== currentCategory) return false;
        if (searchVal && !p.name.toLowerCase().includes(searchVal)) return false;
        return true;
      });

      if (sortVal === 'price-low') filtered.sort((a, b) => a.price - b.price);
      else if (sortVal === 'price-high') filtered.sort((a, b) => b.price - a.price);
      else if (sortVal === 'name') filtered.sort((a, b) => a.name.localeCompare(b.name));

      if (countLabel) countLabel.textContent = `Showing ${filtered.length} Products`;

      if (grid) {
        if (filtered.length === 0) {
          grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:3rem; color:var(--text-muted);">No products found in this category.</div>`;
        } else {
          grid.innerHTML = filtered.map(createProductCardHTML).join('');
        }
      }
    }
  </script>
